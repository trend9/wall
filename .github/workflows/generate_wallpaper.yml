name: Generate Wallpaper

on:
  schedule:
    # Run 6 times a day (every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run generation script
        env:
          HF_TOKEN: "${{ secrets.HF_TOKEN }}"
        run: python scripts/generate_image.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wallpapers.json wallpapers/ feed.xml w/
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate wallpaper [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_GFGRE9Qh1IoeY5gOqFBDFBfW
          VERCEL_PROJECT_ID: prj_F5u6dylD0NR9e1jb3QLGs4YKoLQs
        run: |
          npm install --global vercel
          vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
