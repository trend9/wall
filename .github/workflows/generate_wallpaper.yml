name: Generate Wallpaper

on:
  schedule:
    # Run 6 times a day (every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing the generated image and JSON updates back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run generation script
        run: python scripts/generate_image.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wallpapers.json wallpapers/
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate wallpaper [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
